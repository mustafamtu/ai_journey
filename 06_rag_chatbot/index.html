<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Asistanım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
      border: 2px solid #f9fafb;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    .break-text {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">
  <div class="w-72 bg-white flex flex-col border-r border-gray-200 hidden md:flex z-30 flex-shrink-0">
    <div class="p-5 border-b border-gray-100 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-md shadow-blue-200">
        <i class="fa-solid fa-brain text-white text-sm"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-tight text-gray-900">
          AI Asistan
        </h1>
        <p class="text-xs text-gray-500">v1.0</p>
      </div>
    </div>
    <div class="p-4">
      <button id="newSessionBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:scale-95">
        <i class="fa-solid fa-plus text-sm"></i>
        <span class="font-medium text-sm">Yeni Sohbet</span>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-3 space-y-1" id="sessionList"></div>
    <div class="p-4 border-t border-gray-100 bg-gray-50">
      <div class="flex items-center gap-3 w-full p-2">
        <div
          class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center text-white font-bold shadow-sm">
          ST
        </div>
        <div class="text-left flex-1">
          <p class="text-sm font-semibold text-gray-700">Sadık Turan</p>
          <p class="text-xs text-green-600 font-medium">● Çevrimiçi</p>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1 flex flex-col h-full bg-gray-50/50 min-w-0 relative">
    <div
      class="h-16 shrink-0 border-b border-gray-200 flex items-center justify-between px-6 bg-white/80 backdrop-blur-md z-10">
      <div class="flex items-center gap-2 text-gray-500">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span class="text-xs font-medium">Sistem Hazır</span>
      </div>
      <button id="resetBtn"
        class="text-xs text-gray-400 hover:text-red-500 transition-colors bg-gray-100 px-3 py-1.5 rounded-full"
        title="Oturumu Temizle">
        <i class="fa-solid fa-power-off mr-1"></i> Sıfırla
      </button>
    </div>

    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth w-full">
      <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center animate-fade-in px-4">
        <div
          class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center mb-6 shadow-xl shadow-gray-200 border border-gray-100">
          <i class="fa-solid fa-robot text-4xl text-blue-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Merhaba!</h2>
        <p class="text-gray-500 max-w-md">Nasıl yardımcı olabilirim?</p>
      </div>
    </div>

    <div class="shrink-0 p-4 md:p-6 bg-white border-t border-gray-200 z-20 w-full">
      <div class="max-w-4xl mx-auto relative group">
        <div
          class="relative flex items-end gap-2 bg-gray-50 border border-gray-200 rounded-2xl p-2 shadow-inner focus-within:bg-white focus-within:shadow-md focus-within:border-blue-300 transition-all">
          <textarea id="userInput" rows="1"
            class="flex-1 bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 py-3 px-3 resize-none max-h-32 text-sm md:text-base font-sans"
            placeholder="Bir şeyler yazın..."></textarea>

          <button type="button" id="sendBtn"
            class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

    </div>

    <script>
      const API_URL = "http://localhost:8000";
      const USER_ID = "sadikturan";
      let currentSessionId = null;
      let abortController = null;

      document.addEventListener("DOMContentLoaded", () => {
        initApp();
      })

      async function initApp(){
        const newSessionBtn = document.getElementById("newSessionBtn");
        const resetBtn = document.getElementById("resetBtn");
        const sendBtn = document.getElementById("sendBtn");
        const userInput = document.getElementById("userInput");

        // Olay tetikleyicileri
        if(newSessionBtn) newSessionBtn.addEventListener("click", createNewSession)
        if(resetBtn) resetBtn.addEventListener("click", resetSession)
        if(sendBtn) {
          sendBtn.addEventListener("click", (e) => {
            e.preventDefault();
            handleChatAction();
          })
        }

        // Enter Tuşu Desteği
        if(userInput) {
          userInput.addEventListener("keypress", (e) => {
            if(e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          })
          userInput.focus();
        }

        // Başlangıç Verilerini Yükle
        await loadSessions();

        // Localstorage
        const savedSession = localStorage.getItem("activeSession");
        if(savedSession) {
          await loadChatHistory(savedSession);
        }
      }

      function handleChatAction() {
        const sendBtn = document.getElementById("sendBtn");
        
        if(abortController) {
          abortController.abort();
          abortController = null;
          return;
        }

        sendMessage();
      }

      function resetSession() {
        localStorage.removeItem("activeSession");
        window.location.reload();
      }

      async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();

        if(!text) return;
        
        if(!currentSessionId) {
          alert("Lütfen önce yeni bir sohbet başlatın.");
          return;
        }

        abortController = new AbortController();
        const signal = abortController.signal;

        input.value="";
        sendBtn.innerHTML = "<i class='fa-solid fa-stop'></i>";
        sendBtn.classList.remove("bg-blue-600","hover:bg-blue-700");
        sendBtn.classList.add("bg-red-600","hover:bg-red-700");

        const chatContainer = document.getElementById("chatContainer");
        if(chatContainer.innerHTML.includes("Sohbet Boş")) chatContainer.innerHTML = "";

        // Kullanıcı mesajı ekle
        appendMessage("user", text);
        scrollToBottom();

        // Düşünüyor... 
        const botBubble = appendMessage("assistant", "...");
        const contentDiv = botBubble.querySelector(".message-content");
        contentDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Düşünüyor...'; 

        try {
          const res = await fetch(`${API_URL}/chat`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({session_id: currentSessionId, query: text}),
            signal: signal
          });
          
          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");

          let isFirstChunk = true;

          while (true) {
            const {done, value} = await reader.read();

            if (done) break;

            if(signal.aborted) { break; }

            if(isFirstChunk) {
              contentDiv.innerHTML = "";
              isFirstChunk=false;
            }

            const chunk = decoder.decode(value, {stream: true});

            contentDiv.textContent += chunk;
            scrollToBottom();
          }
        }
        catch(err) {
          if(err.name == "AbortError") {
            contentDiv.innerHTML = "<span class='text-xs text-red-500 italic'>Durduruldu.</span>"
          } else {
            contentDiv.innerHTML = "<span class='text-red-500'>⚠️Hata oluştu.</span>"
            console.log(err);
          }
        }
        finally {
          abortController = null;
          sendBtn.innerHTML = "<i class='fa-solid fa-paper-plane'></i>";
          sendBtn.classList.remove("bg-red-600","hover:bg-red-700");
          sendBtn.classList.add("bg-blue-600","hover:bg-blue-700");

          scrollToBottom();
          input.focus();
        }
      }
      async function loadSessions() {
        try {
          const res = await fetch(`${API_URL}/sessions/${USER_ID}`);
          const sessions = await res.json();
          const listContainer = document.getElementById("sessionList");

          if(sessions.length === 0) {
            listContainer.innerHTML = '<div class="text-center text-gray-400 text-xs mt-4">Henüz sohbet yok.</div>';
             return;
          }

          listContainer.innerHTML = "";

          sessions.forEach(session => {
            const btn = document.createElement("button");
            const isActive = session.session_id === currentSessionId;

            btn.className = `
              w-full text-left p-3 rounded-xl text-sm mb-1 truncate transition-all flex items-center gap-3 border ${isActive ? 
              "bg-blue-50 text-blue-700 border-blue-200 font-medium":
              "text-gray-600 hover:bg-gray-50 hover:text-gray-900 border-transparent"
            }`;

            btn.innerHTML = `<i class="fa-regular fa-message ${isActive ? "text-blue-600": "text-gray-400"}"></i> 
            <span class="truncate">${session.title}<span/>`;

            btn.addEventListener("click", () => loadChatHistory(session.session_id))

            listContainer.appendChild(btn);
          });
        }
        catch(e) {
          console.log(e);
        }
      }
      async function loadChatHistory(sessionId) {
        currentSessionId = sessionId;
        localStorage.setItem("activeSession", sessionId);
        loadSessions();

        try {
          const res = await fetch(`${API_URL}/history/${sessionId}`);
          const messages = await res.json();
          const charContainer = document.getElementById("chatContainer");

          charContainer.innerHTML = "";

          if(messages.length === 0) {
              chatContainer.innerHTML = `<div class="flex flex-col items-center justify-center h-full animate-fade-in p-4"><div class="bg-amber-50 border border-amber-200 rounded-xl p-4 max-w-md w-full shadow-sm flex items-start gap-3"><div class="bg-amber-100 p-2 rounded-lg text-amber-600"><i class="fa-solid fa-triangle-exclamation"></i></div><div><h3 class="font-bold text-amber-800 text-sm">Sohbet Boş</h3><p class="text-amber-700 text-xs mt-1">Hadi, ilk mesajını yaz!</p></div></div></div>`;
              return;
          }

          messages.forEach((msg) => appendMessage(msg.role, msg.content));
          scrollToBottom();
        } catch(e) {
          console.error(e);
        }

      }
      async function createNewSession() {
        const title = prompt("Sohbet başlığı:", "Yeni Konu");
        if(!title) return;

        try 
        {
          const res = await fetch(`${API_URL}/sessions/create`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({user_id: USER_ID, title: title}),
          });
          const data = await res.json();
          await loadChatHistory(data.session_id);
        }
        catch(error) {
          console.error(error)
        }
      }

      function appendMessage(role, text) {
        const container = document.getElementById("chatContainer");
        const isUser = role === "user";
        const div = document.createElement("div");
        div.className = `flex gap-4 ${isUser ? "flex-row-reverse" : "flex-row"
          } animate-fade-in group w-full`;

        const avatar = isUser
          ? `<div class="w-9 h-9 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-xs font-bold text-white shadow-sm ring-2 ring-white">ST</div>`
          : `<div class="w-9 h-9 rounded-full bg-white flex-shrink-0 flex items-center justify-center text-xs text-blue-600 shadow-sm border border-gray-200"><i class="fa-solid fa-robot text-lg"></i></div>`;

        const bubbleStyle = isUser
          ? "bg-blue-600 text-white rounded-2xl rounded-tr-none shadow-md shadow-blue-100"
          : "bg-white text-gray-800 border border-gray-200 rounded-2xl rounded-tl-none shadow-sm";

        div.innerHTML =
          avatar +
          `<div class="max-w-[85%] md:max-w-[75%] min-w-0"><div class="message-content text-[15px] leading-relaxed py-3.5 px-5 break-text ${bubbleStyle}">${isUser ? escapeHtml(text) : text
          }</div></div>`;

        container.appendChild(div);
        return div;
      }
      function escapeHtml(text) {
          if (!text) return text;
          return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
      }
      function scrollToBottom() {
          const container = document.getElementById("chatContainer");
          if (container) {
            setTimeout(() => {
              container.scrollTo({
                top: container.scrollHeight,
                behavior: "smooth",
              });
            }, 50);
          }
      }

    </script>


</body>

</html>
